<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password - 1GEN CHAT WITH AI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 50px;
            width: 100%;
            max-width: 450px;
            animation: slideUp 0.6s ease-out;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h2 {
            font-size: 2.2em;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header p {
            color: #666;
            font-size: 0.95em;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: #333;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1em;
            transition: all 0.3s ease;
            background: #f8f9fa;
        }

        input:focus {
            outline: none;
            background: white;
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
            margin-bottom: 20px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.5);
        }

        .back-link {
            text-align: center;
            color: #666;
            font-size: 0.95em;
        }

        .back-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .message {
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }

        .error {
            background: #fee;
            color: #c33;
            border-left: 4px solid #c33;
        }

        .success {
            background: #efe;
            color: #3c3;
            border-left: 4px solid #3c3;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 15px;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(102, 126, 234, 0.3);
            border-radius: 50%;
            border-top-color: #667eea;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="container" id="resetFormContainer">
        <div class="header">
            <h2>🔒 New Password</h2>
            <p>Please enter your new password below.</p>
        </div>

        <div id="messageBox" class="message"></div>

        <form onsubmit="handleSubmit(event)">
            <div class="form-group">
                <label for="password">🆕 New Password</label>
                <input id="password" type="password" placeholder="Min 6 characters" required minlength="6">
            </div>

            <div class="form-group">
                <label for="confirmPassword">✅ Confirm Password</label>
                <input id="confirmPassword" type="password" placeholder="Repeat new password" required>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">Update Password</button>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Updating password...</p>
            </div>
        </form>
    </div>

    <div class="container" id="invalidTokenContainer" style="display: none;">
        <div class="header">
            <h2>❌ Invalid Link</h2>
            <p>This password reset link is invalid or has expired.</p>
        </div>
        <div class="back-link">
            <a href="forgot-password.html">Request a new link</a>
        </div>
    </div>

    <script>
        // Get token from URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        if (!token) {
            document.getElementById('resetFormContainer').style.display = 'none';
            document.getElementById('invalidTokenContainer').style.display = 'block';
        }

        async function handleSubmit(event) {
            event.preventDefault();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const messageBox = document.getElementById('messageBox');
            const submitBtn = document.getElementById('submitBtn');
            const loading = document.getElementById('loading');

            if (password !== confirmPassword) {
                messageBox.textContent = '❌ Passwords do not match';
                messageBox.className = 'message error';
                messageBox.style.display = 'block';
                return;
            }

            messageBox.style.display = 'none';
            loading.style.display = 'block';
            submitBtn.disabled = true;

            try {
                const res = await fetch('/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, newPassword: password })
                });

                const data = await res.json();

                if (res.ok) {
                    messageBox.textContent = '✅ Password updated! Redirecting to login...';
                    messageBox.className = 'message success';
                    messageBox.style.display = 'block';
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                } else {
                    messageBox.textContent = '❌ ' + (data.message || 'Error updating password');
                    messageBox.className = 'message error';
                    messageBox.style.display = 'block';
                }
            } catch (error) {
                messageBox.textContent = '❌ An error occurred. Please try again.';
                messageBox.className = 'message error';
                messageBox.style.display = 'block';
            } finally {
                loading.style.display = 'none';
                submitBtn.disabled = false;
            }
        }
    </script>
</body>

</html>
